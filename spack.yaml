spack:
  definitions:
  - _name: [access-issm]
  - _version: [2026.07.0]

  specs:
  - access-issm

  packages:
    issm:
      require:
      - '@git.2026.05.18'
      - +wrappers
      - +py-tools
      - +production
      - +cuda
      - cuda_arch=80
      - +hypre

    cuda:
      externals:
      - spec: cuda@12.3.2
        prefix: /apps/cuda/12.3.2
        modules: [cuda/12.3.2]
      buildable: false

    petsc:
      require:
      - '@3.21.1'
      - +cuda
      - +hypre
      - cuda_arch=80

    hypre:
      require:
      - '@2.31.0'
      - +cuda
      - cuda_arch=80

    python:
      require:
      - '@3.11.14'

    py-numpy:
      require:
      - '@1.26.4'

    openmpi:
      externals:
      - spec: openmpi@4.1.3+cuda
        prefix: /apps/openmpi/4.1.3
        modules: [openmpi/4.1.3]
      buildable: false
      require:
      - '@4.1.3+cuda'

    access-triangle:
      require:
      - '@1.6.1'

    metis:
      require:
      - '@5.1.0'

    access-mumps:
      require:
      - '@5.8.2'

    parmetis:
      require:
      - '@4.0.3'

    netlib-scalapack:
      require:
      - '@2.2.0'

    autoconf:
      require:
      - '@2.72'

    automake:
      require:
      - '@1.16.5'

    libtool:
      require:
      - '@2.4.7'

    m4:
      require:
      - '@1.4.19'

    # Workaround: https://github.com/spack/spack-packages/pull/3644
    re2c:
      require:
      - '@3.1'

    # gcc@12.2.0 is not in the Gadi v1.1 site config (only 13/14/15 are);
    # declare it as an explicit external so Spack doesn't try to build it.
    # GCC 12 is the newest version officially supported by CUDA 12.3.2 nvcc.
    gcc:
      externals:
      - spec: gcc@12.2.0 languages:='c,c++,fortran'
        prefix: /apps/gcc/12.2.0/wrappers
        modules: [gcc/12.2.0]
      buildable: false

    c:
      require:
      - 'gcc@12.2.0'
    cxx:
      require:
      - 'gcc@12.2.0'
    fortran:
      require:
      - 'gcc@12.2.0'

    all:
      prefer:
      - 'target=x86_64'

  modules:
    default:
      tcl:
        projections:
          access-issm: "{name}/{version}"

  view: true
  concretizer:
    unify: true
