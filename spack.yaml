spack:
  definitions:
  - _name: [access-issm]
  - _version: [2026.05.0]
  # _spack-version and _custom-scopes inform the branch of spack to use, and custom scopes if applicable, respectively
  - _spack-version: ["1.1"]
  # Release database provenance information - packages for inclusion into the database, and packages just for injection into the modules
  - _provenance: ["issm"]
  - _injection: ["openmpi", "access-triangle"]
  specs:
  - access-issm
  packages:
    issm:
      require:
      - '@git.2026.05.18'
      - +wrappers
      - +py-tools
      - ~ad
      - +production

    python:
      require:
      - '@3.11.14'

    py-numpy:
      require:
      - '@1.26.4'

    openmpi:
      require:
      - '@4.1.5'

    access-triangle:
      require:
      - '@1.6.1'

    petsc:
      require:
      - '@3.21.1'

    metis:
      require:
      - '@5.1.0'

    access-mumps:
      require:
      - '@5.8.2'

    parmetis:
      require:
      - '@4.0.3'

    netlib-scalapack:
      require:
      - '@2.2.0'

    autoconf:
      require:
      - '@2.72'

    automake:
      require:
      - '@1.16.5'

    libtool:
      require:
      - '@2.4.7'

    m4:
      require:
      - '@1.4.19'

    # Wokaround due to https://github.com/spack/spack-packages/pull/3644
    re2c:
      require:
      - '@3.1'

    # Compilers
    c:
      require:
      - 'intel-oneapi-compilers@2025.2.0'
    cxx:
      require:
      - 'intel-oneapi-compilers@2025.2.0'
    fortran:
      require:
      - 'intel-oneapi-compilers@2025.2.0'

    # “all” can remain empty if you aren’t forcing any particular compiler / MPI
    all:
      prefer:
      - 'target=x86_64'
  modules:
    default:
      tcl:
        projections:
          access-issm: "{name}{^issm.variants.ad}/{version}"
  # Create a unified view of all installed packages
  view: true
  # Make the solver unify dependencies
  concretizer:
    unify: true
  repos:
    access_spack_packages:
      git: https://github.com/ACCESS-NRI/access-spack-packages.git
      tag: 2026.05.002
      destination: $env/.package_repos/access-spack-packages
