spack:
  definitions:
  - _name: [access-issm]
  - _version: [2026.07.0]

  specs:
  - access-issm

  packages:
    issm:
      require:
      - '@git.2026.05.18'
      - +wrappers
      - +py-tools
      - +production
      - +cuda
      - cuda_arch=80
      - +hypre

    cuda:
      externals:
      - spec: cuda@12.3.2
        prefix: /apps/cuda/12.3.2
        modules: [cuda/12.3.2]
      buildable: false

    petsc:
      require:
      - '@3.21.1'
      - +cuda
      - +hypre
      - cuda_arch=80

    hypre:
      require:
      - '@2.31.0'
      - +cuda
      - cuda_arch=80

    python:
      require:
      - '@3.11.14'

    py-numpy:
      require:
      - '@1.26.4'

    openmpi:
      require:
      - '@4.1.5'

    access-triangle:
      require:
      - '@1.6.1'

    metis:
      require:
      - '@5.1.0'

    access-mumps:
      require:
      - '@5.8.2'

    parmetis:
      require:
      - '@4.0.3'

    netlib-scalapack:
      require:
      - '@2.2.0'

    autoconf:
      require:
      - '@2.72'

    automake:
      require:
      - '@1.16.5'

    libtool:
      require:
      - '@2.4.7'

    m4:
      require:
      - '@1.4.19'

    # Workaround: https://github.com/spack/spack-packages/pull/3644
    re2c:
      require:
      - '@3.1'

    c:
      require:
      - 'intel-oneapi-compilers@2025.2.0'
    cxx:
      require:
      - 'intel-oneapi-compilers@2025.2.0'
    fortran:
      require:
      - 'intel-oneapi-compilers@2025.2.0'

    all:
      prefer:
      - 'target=x86_64'

  modules:
    default:
      tcl:
        projections:
          access-issm: "{name}/{version}"

  view: true
  concretizer:
    unify: true
